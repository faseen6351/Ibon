name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # End-to-end smoke test of the real app (see scripts/smoke.mjs). Windows and Linux pass every check and
      # block merges. macOS had one false failure (a temp-folder symlink in the test, now fixed), so it still only
      # reports; remove continue-on-error from it once it has been green. NOTE: continue-on-error shows the job as
      # green even when the step failed, so read the step's log, not just the tick.
      - name: Smoke test
        if: runner.os == 'Windows'
        run: npm run smoke
      - name: Smoke test (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run smoke
      - name: Smoke test (macOS)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: npm run smoke

  package:
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Builds the unpacked app only (no installer, no signing) to catch packaging breakage on every PR.
      - run: npm run pack
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Ibon ships Chromium through Electron, so a known Electron advisory is a release blocker.
      - run: npm audit --audit-level=high
